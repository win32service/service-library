name: Windows extension tests

on:
  push:
    branches: ['1.x']
  pull_request:
    branches: ['1.x']
  workflow_dispatch:
    inputs:
      extension_version:
        description: 'Version constraint of win32service/win32service to install via PIE (e.g. "1.0.0" or "^1.0"). Leave empty to install the latest stable version.'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  functional-tests:
    name: PHP ${{ matrix.php }} (${{ matrix.ts }}, x64)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        ts: ['ts', 'nts']
    steps:
      - uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: pie
          coverage: none
        env:
          phpts: ${{ matrix.ts }}

      - name: Install win32service extension via PIE
        env:
          EXTENSION_VERSION: ${{ github.event.inputs.extension_version }}
        run: |
          $package = "win32service/win32service"
          if ($env:EXTENSION_VERSION -ne "") {
            $package = "$($package):$($env:EXTENSION_VERSION)"
          }
          Write-Host "Installing $package"
          pie install $package

      - name: Check the extension is enabled
        run: php --ri win32service

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run service lifecycle functional test (register, start, stop, delete)
        run: php .github/scripts/windows-service-tests/lifecycle-test.php

      - name: Record time before the slow-start test
        run: echo "SLOW_START_TEST_BEGIN=$(Get-Date -Format o)" >> $env:GITHUB_ENV

      - name: Run slow-start service lifecycle test (setup() over 30s, e.g. Symfony cache warmup)
        run: php .github/scripts/windows-service-tests/slow-start-lifecycle-test.php

      - name: Check Service Control Manager event log for start timeouts
        if: always()
        run: |
          $since = [DateTime]::Parse($env:SLOW_START_TEST_BEGIN)
          $events = Get-WinEvent -FilterHashtable @{
            LogName      = 'System'
            ProviderName = 'Service Control Manager'
            StartTime    = $since
          } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -like '*win32service_lib_slow_start_test*' } |
            Sort-Object TimeCreated

          if (-not $events) {
            Write-Host 'No Service Control Manager event referencing the slow-start test service was found.'
            exit 0
          }

          foreach ($serviceEvent in $events) {
            Write-Host "[$($serviceEvent.TimeCreated.ToString('o'))] Id=$($serviceEvent.Id) $($serviceEvent.LevelDisplayName): $($serviceEvent.Message)"
          }

          if ($events | Where-Object { $_.Id -eq 7009 }) {
            Write-Warning 'Event 7009: the Service Control Manager reported a timeout waiting for the service to report it was running, even though polling later observed WIN32_SERVICE_RUNNING.'
          }
